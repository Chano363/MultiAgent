algorithm:
  name: "PPO"

training:
  total_frames: 100000
  gamma: 0.99
  gae_lambda: 0.92
  num_envs: 4
  hyperparameters:
    dqn:
      learning_rate: 0.00025
      gamma: 0.99
      epsilon_start: 1.0
      epsilon_decay: 0.995
      epsilon_min: 0.01
      buffer_size: 100000
      batch_size: 128
      target_update_freq: 100
      network_architecture: [256, 256, 128]
      use_layer_norm: true
      use_prioritized_replay: true
      double_dqn: true
    
    ppo:
      learning_rate: 0.0003
      gamma: 0.99
      gae_lambda: 0.95
      clip_epsilon: 0.15
      entropy_coef: 0.001
      value_coef: 0.5
      max_grad_norm: 0.5
      epochs: 10
      batch_size: 128
      n_steps: 400
      use_gae: true
      use_clipped_value_loss: true
      use_entropy_decay: false
    
    mappo:
      learning_rate: 0.00005
      gamma: 0.99
      gae_lambda: 0.95
      clip_epsilon: 0.2
      entropy_coef: 0.005
      value_coef: 0.5
      max_grad_norm: 0.5
      epochs: 4
      batch_size: 64
      use_gae: true
      use_clipped_value_loss: true
    
    sac:
      learning_rate: 0.0001
      gamma: 0.99
      tau: 0.001
      alpha: 0.02       # 固定低alpha，使策略接近确定性，减少探索噪声
      automatic_entropy_tuning: false  # 关闭自动调优，防止α被调高导致策略发散
      buffer_capacity: 1000000
      batch_size: 256

logging:
  log_interval: 10
  save_interval: 1000
  tensorboard: true
  log_dir: "outputs/logs"
  checkpoint_dir: "outputs/checkpoints"