# 立论级 Claim 台账（SSOT for 事实性断言）
#
# 作用：让"某个事实到底怎么表述"只有**一处权威**，其它文档只许引用/复述，不许另立说法。
# 治理铁律（详见 scripts/check_claim_ledger.py 与待追认的 ADR）：
#   1. claim 变更 = 改本台账 + 全仓 Grep 旧措辞（禁止"只在原位加补注"）
#   2. 否定命题（polarity: negative，如"空白/未见/无人"）必须有检索台账支撑，
#      且 grade 不得高于证据允许的等级；grade A = 本地全文一手
#   3. 每条 claim 的 evidence 必须"存活"：文件存在 + 行号在范围内 + 锚词仍在该区间
#   4. 旧措辞进 forbidden 列表，脚本一旦在非历史文档中命中即报错
#
# 历史日志（docs/logs/**）append-only，命中只记 WARN，不要求回改。

meta:
  version: 2
  updated: "2026-10-20"
  owner: 立论线
  checker: scripts/check_claim_ledger.py
  negative_requires: "A 全文级 + 检索台账"   # 否定命题的证据门槛

  # 临时工具文档（与 PPT 大纲同质）：允许事实重复、不保证严谨。
  # 规则：① 允许与台账/SSOT 措辞不一致（校验器只记 WARN）② 不得作为证据源
  #      ③ 查阅资料/立论引用时禁止检索这些目录 ④ 未经 owner 允许禁止修改
  ephemeral_globs:
    - "ppt_talk/"
    - "docs/杂项/"

  # 写入保护：这些目录未经 owner 明确允许不得改动（校验器用 git 脏文件检测）
  protected_globs:
    - "ppt_talk/"
    - "docs/杂项/"


