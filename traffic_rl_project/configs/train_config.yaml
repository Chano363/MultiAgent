algorithm:
  name: "SAC"

training:
  total_frames: 100000
  gamma: 0.99
  gae_lambda: 0.92
  num_envs: 4
  hyperparameters:
    dqn:
      learning_rate: 0.00025
      gamma: 0.99
      epsilon_start: 1.0
      epsilon_decay: 0.995
      epsilon_min: 0.01
      buffer_size: 100000
      batch_size: 128
      target_update_freq: 100
      network_architecture: [256, 256, 128]
      use_layer_norm: true
      use_prioritized_replay: true
      double_dqn: true
    
    ppo:
      learning_rate: 0.00003
      gamma: 0.99
      gae_lambda: 0.92
      clip_epsilon: 0.08
      entropy_coef: 0.01
      value_coef: 0.5
      max_grad_norm: 0.8
      epochs: 8
      batch_size: 128
      n_steps: 128
      use_gae: true
      use_clipped_value_loss: true
      use_entropy_decay: false
    
    sac:
      learning_rate: 0.0001
      gamma: 0.99
      tau: 0.005
      alpha: 0.2
      automatic_entropy_tuning: true
      buffer_capacity: 1000000
      batch_size: 256

logging:
  log_interval: 10
  save_interval: 1000
  tensorboard: true
  log_dir: "outputs/logs"
  checkpoint_dir: "outputs/checkpoints"