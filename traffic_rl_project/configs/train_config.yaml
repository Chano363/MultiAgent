algorithm:
  name: "PPO"

network:
  actor:
    hidden_sizes: [128, 128]
    activation: "relu"
  critic:
    hidden_sizes: [256, 256]
    activation: "relu"

training:
  total_frames: 100000
  batch_size: 256
  n_steps: 100
  gamma: 0.99
  gae_lambda: 0.95
  num_envs: 4

optimizer:
  lr: 3e-4
  eps: 1e-5

ppo:
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  epochs: 10

logging:
  log_interval: 10
  save_interval: 1000
  tensorboard: true
  log_dir: "outputs/logs"
  checkpoint_dir: "outputs/checkpoints"
