# ⛔ 【2026-11-13 ADR-068】本配置沿用旧口径 v_max=80 km/h（target=60 / d_eff=138.5）。
#    其结果**不得**与 v_max=75 口径的数字并列引用；如需复现请按 ADR-068 六量同批改口径。
# ADR-064 pilot E2：decision_interval 10→100（1 s→10 s）+ 每集 700 s + **固定起点 4300**
# 唯一目的：与 E1 配对，隔离"随机起点"这一项对 peak/violations 的贡献（单因素对照）。
# 除 start_randomization / name / dirs 外，与 _pilot_di100_700s_rand.yaml 逐位一致。
# ⚠️ pilot 结果不得进正文主表（ADR-017 沙盒纪律）。
name: pilot_di100_700s_fix
algorithm: mappo
algo_params:
  learning_rate: 0.00002
  gamma: 0.990                # 【ADR-064】与 E1 同口径，保持 91 s 视界
  gae_lambda: 0.899
  critic: per_agent
  clip_epsilon: 0.15
  entropy_coef: 0.005
  value_coef: 0.5
  epochs: 10
  batch_size: 128
  max_grad_norm: 0.5

env_type: fleet
env_cfg:
  num_trains: 3
  consist_preset: 10kt_1plus108
  grade_profile: shuozhou_ningwuxi_beidaniu_49km
  v_max: 22.22222222222222
  v_min: 11.111
  max_steps: 7000
  route_end_m: 49600
  max_accel: 1.0
  use_coupler_constraint: true
  coupler_force_limit_n: 1000000.0
  speed_band_shape: ref
  reward_term_log: true
  speed_ref_table: outputs/sim_validation/phys_validation/refspeed_baseline_20261111_090221/ref_speed_table.npz
  speed_over_w: 10.0
  hierarchical: false
  decompose: loco_ed_ab
  ab_min_refill_s: 222.0
  ab_min_hold_s: 0.0
  ed_native_force_conversion: true
  coupler_force_limit_emergency_n: 2250000.0
  cyclic_notch_50: true
  service_reduction_kpa: 74.12781799739679
  ab_staged_apply: true
  ab_staged_gap_s: 3.0
  cyclic_brake_trigger_kmh: 65.95262385531505
  cyclic_release_kmh: 54.956448104474134
  ed_release_coordination: true
  ed_release_hold_s: 16.970343976123257
  ed_release_boost_kn: 835.5980537119971
  cyclic_ab_upgrade_kmh: 71.08494805964575
  ed_upgrade_ramp_s: 16.65239691095876
  ed_upgrade_ramp_scale: 0.8225254007598803
  ed_grade_feedforward: true
  coupler_override: release
  eot: true
  # 【E2】固定起点 4300（与主配置一致），作为 E1 的对照组
  start_randomization:
    enabled: true
    min_m: 4300
    max_m: 4300

obs: env
action: continuous
interaction: mappo_fleet
reward: env_default

num_trains: 3
decision_interval: 100
episodes: 60
curriculum: "7000:0"
n_env: 4
n_env_parallel: true
parallel_traj_len: 0
warm_start: false
bc_episodes: 1
bc_epochs: 3000
bc_max_steps: 7000
long_eval_interval: 0
long_eval_steps: 7000
init_speed_kmh: 60.0
simcase: official
ckpt_policy: fleet
log_interval: 1

dirs:
  checkpoint_dir: outputs/checkpoints/formation_10kt_1plus108/_pilot_di100_fix
  results_dir: outputs/results/formation_10kt_1plus108/_pilot_di100_fix
  figures_dir: outputs/figures/formation_10kt_1plus108/_pilot_di100_fix
