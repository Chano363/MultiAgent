# 2026-10-17: 新研究编组；继承参数仅为待验证起点，旧两万吨效果不适用于本配置。
# 2026-10-21: 训练时域改**全剖面**（curriculum 36000:0）、并行默认开、ep 预算按全剖面重定。
# ═══════════════════════════════════════════════════════════════════════════
# formation-aware 机车级 ED/AB 分工（唯一 RL 落位，ADR-013）
#   3列 × 1+0（每列1机车+108货车，10988t）= 3 agents（ADR-039）
#   以【编队】为上下文：观测含列间间距误差 obs[10]，奖励含 gap 编队项
#   底层规则循环制动 + 车钩力安全层（1000kN验收目标；安全层执行不等于已证明全过程满足）确定性执行
# 入口：python run_training.py --experiment configs/experiments/formation_ed_ab_3train_1plus108.yaml
# ═══════════════════════════════════════════════════════════════════════════
name: formation_ed_ab_3train_1plus108
algorithm: mappo
algo_params:                  # 【2026-09-09 发散调参 run2】降lr/收clip/提entropy 治 KL 早停频发 + best 冻结 + reward 深负
  learning_rate: 0.00002      # 0.00005→0.00002：抑制每批更新过激（原 KL 频繁 epoch2-5 早停）
  gamma: 0.999                # 【ADR-021 方向 B】0.99→0.999：信用视界 1/(1-γλ)≈91 决策步
  gae_lambda: 0.99            # ×DI=10 原始步 ×dt=0.1s ≈91 s ≥ AB→车钩力峰值≈90 s 物理滞后
                              # （原 0.99/0.95 仅≈16.8 s，根本无法把远期破线归因到早期 AB 决策）
  critic: per_agent           # 【ADR-021 方向 B】per-agent 价值头 → per-agent advantage，
                              # 替代"单标量 advantage 广播到 6 台机车"。⚠️ 改算法 ⇒ 旧 ckpt 失效，须重训
  clip_epsilon: 0.15          # 0.2→0.15：更保守的策略更新步长
  entropy_coef: 0.005         # 0.002→0.005：原 best 冻结在 ep1(+8638)再也逃不出坏的确定性行为，提熵促探索
  value_coef: 0.5
  epochs: 10
  batch_size: 128
  max_grad_norm: 0.5

env_type: fleet                # TrainFleetEnv（多列编队环境，3 列）
env_cfg:
  num_trains: 3
  consist_preset: 10kt_1plus108  # 每列1机车+108货车，10988t；3列=3智能体
  grade_profile: shuozhou_ningwuxi_beidaniu_49km  # 【主训练】朔黄线宁武西→北大牛真实纵断面 49.6km（50 实测坡段，统一线路表）；23.8km 仅作历史复现
  v_max: 22.22222222222222     # 准确80 km/h；达到上限仍按安全规则制动
  v_min: 11.111                # 40 km/h（编队目标速度带）
  target_gap: 100.0            # 安全列距目标
  max_steps: 36000             # env 截断上限 / 评估口径 =3600s，49.6km 全程（avg≥~13.8m/s 跑满 49.6km）。
                               # 2026-10-21 起**训练时域 = 本值**（curriculum 36000:0），不再用 1200 步短窗。
  max_accel: 1.0
  use_coupler_constraint: true
  coupler_force_limit_n: 1000000.0  # 当前研究统一验收指标1000kN（ADR-040）
  # ATP/ETCS 真 ATP 为永久启用的安全底线，无 enable_etcs 开关（恒启）。历史 false 开关已移除。
  hierarchical: false          # decompose 模式自带规则基线，不与阈值协同混用
  decompose: loco_ed_ab        # 机车级 ED/AB 分工：每机车行为 [ed_mod, ab_mod]∈[-1,1]²
  ab_min_refill_s: 222.0       # 【ADR-021 方向 A，Zhang2024】新增 AB 源前的最小充风时间（s）：
                               # 出处 = VALIDATION_BASELINE.md 张二田 S6 最短充风 222 s（范围 175~512 s）
  ab_min_hold_s: 0.0           # 【方向 A】已建立 AB 源的最小保持时间（s）：**已结案 = 无出处、不激活**（默认 0.0）。
                               # 2026-10-01 检索：Zhang2024 运行约束仅三条（无此项）；《铁路机车操作规则》
                               # （TG/JW104-2012）最接近的是"列检站保压试验 3 min"（非运行约束）与
                               # "重载列车 v<30km/h 不应缓解"（速度门限，且本场景 v_min=40km/h ⇒ 空约束）。
                               # 详见 REFERENCE_INDEX.md 落地映射 + DIAGNOSTICS_2026-10.md「检索-2026-10-01」
  # 【2026-10-21 关闭】训练改为全剖面后，每集本来就从 km0 跑满 49.6km，起点随机化不再有意义
  # （它的原目的是让 ≤1200 步短窗在分布上覆盖全路，见 L2 A/B 结论）。
  start_randomization:
    enabled: false

obs: env                       # 逐机车 11 维观测（含编队上下文 obs[10]=列间间距误差）
action: continuous
interaction: mappo_fleet       # MAPPO 交互（decompose：agent=每机车）
reward: env_default            # decompose 模式奖励口径 = _calculate_reward_decomposed（R2+gap 编队项+车钩力）

num_trains: 3
decision_interval: 10          # 半MDP 决策间隔（动作保持，剪短信用链）
episodes: 40                   # 【2026-10-21 全剖面口径】单集 36000 步 ≈ 2.5h（4 并行 worker 实测 0.25 s/步）
                               # ⇒ 40 ep ≈ 4.2 天。旧 1400 ep 是 1200 步短窗口径，全剖面下折合 146 天，已作废。
                               # ⚠️ 全剖面的每集梯度信息量远大于短窗，ep 数不可按短窗比例换算。
curriculum: 36000:0            # 【2026-10-21】全剖面训练：全程 3600 s，不再用 500/1000/1200 步爬坡。
                               # 旧 1200 步窗口会把工况截断（起步瞬态峰值 1009 kN 与全剖面 ≈600 kN 不是同一回事）。
n_env: 4                       # 【ADR-017 配套 + 诊断-2026-09-10】并行 rollout ≥4 条独立短轨迹：advantage 信噪比 ×n_env，
                               # 且 value 不被单条长轨迹绑架。
n_env_parallel: true           # 【2026-10-21 用户裁定：并行默认打开】schema 默认已改 True，此处显式写出便于 metadata 追溯。
                               # 实测依据：默认 False 时 n_env=4 是**单核串行**（500 步/集 ≈4.5 min、无子进程）。
parallel_traj_len: 0           # 0 = 沿用 curriculum horizon
warm_start: true               # 【必须采用】先用规则基线做行为克隆（BC）热启动，再 RL 微调 → 保安全探索
bc_episodes: 1                 # 【2026-10-21】全剖面口径：1 集足够采满全程（旧 3 集是短窗口径）
bc_epochs: 30                  # 与已验证配方一致（schema 默认 5 偏弱；30 为诊断验证值）
bc_max_steps: 36000            # 【2026-10-21 新增可配置】BC 采集步数上限 = 全剖面；旧实现硬编码 1500 步
                               # （≈1/24 剖面，只覆盖起步段）。⚠️ 1 集 36000 步 ≈ 1.9 h。
long_eval_interval: 0          # 【2026-10-21 关闭】训练时域已 = 评估时域（都是 36000 步全剖面），
                               # 再跑独立 long_eval 只是把同一剖面重算一遍（每次 ≈55 min×28 次）。
                               # 若将来训练时域再缩短，必须恢复本值（ADR-017 选优机制）。
long_eval_steps: 36000         # 保留：供评估/选优脚本使用
init_speed_kmh: 80.0
simcase: official
ckpt_policy: fleet
log_interval: 1                # 【2026-10-21 静默治理】每集都落一行（全剖面 2.5h/集，若按 10 集会 25h 才见一行）

dirs:
  checkpoint_dir: outputs/checkpoints/formation_10kt_1plus108/fullprof_20261021/seed0
  results_dir: outputs/checkpoints/formation_10kt_1plus108/fullprof_20261021/seed0/results
  figures_dir: outputs/checkpoints/formation_10kt_1plus108/fullprof_20261021/seed0/figures
