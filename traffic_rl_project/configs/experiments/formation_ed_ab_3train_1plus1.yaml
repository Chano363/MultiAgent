# ═══════════════════════════════════════════════════════════════════════════
# formation-aware 机车级 ED/AB 分工（唯一 RL 落位，ADR-013）
#   3 列 × 1+1（每列 首/尾 双机车）= 6 agents（每台机车 = 智能体）
#   以【编队】为上下文：观测含列间间距误差 obs[10]，奖励含 gap 编队项
#   底层规则循环制动 + 车钩力安全层（enforce_coupler≤1000kN）确定性执行
# 入口：python run_training.py --experiment configs/experiments/formation_ed_ab_3train_1plus1.yaml
# ═══════════════════════════════════════════════════════════════════════════
name: formation_ed_ab_3train_1plus1
algorithm: mappo
algo_params:                  # 【2026-09-09 发散调参 run2】降lr/收clip/提entropy 治 KL 早停频发 + best 冻结 + reward 深负
  learning_rate: 0.00002      # 0.00005→0.00002：抑制每批更新过激（原 KL 频繁 epoch2-5 早停）
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.15          # 0.2→0.15：更保守的策略更新步长
  entropy_coef: 0.005         # 0.002→0.005：原 best 冻结在 ep1(+8638)再也逃不出坏的确定性行为，提熵促探索
  value_coef: 0.5
  epochs: 10
  batch_size: 128
  max_grad_norm: 0.5

env_type: fleet                # TrainFleetEnv（多列编队环境，3 列）
env_cfg:
  num_trains: 3
  consist_preset: 10kt_1plus1  # 每列 1机车+94货车+1机车（多机车分布式动力，index [0,95]）
  grade_profile: shuozhou_real_53km       # 【2026-09-09 新主主线】朔黄线真实纵断面 53.2km（58 实测坡段）；23.8km 仅作历史复现
  v_max: 22.222                # 80 km/h
  v_min: 11.111                # 40 km/h（编队目标速度带）
  target_gap: 100.0            # 安全列距目标
  max_steps: 36000             # 【53km 全程全覆盖】=3600s；avg≥~14.8m/s 即跑满 53.2km（原 15000 步仅~24km）
  max_accel: 1.0
  use_coupler_constraint: true
  enable_etcs: true             # 【2026-09-09 修复】真 ATP 列间防追尾默认关(False)；run_training/decompose 未显式开→ETCS 未生效→53km 负间距追尾坍缩(见 DIAGNOSTICS#2332"训练必须--etcs"，评估侧 hardcode=True)。此处对齐评估开启
  hierarchical: false          # decompose 模式自带规则基线，不与阈值协同混用
  decompose: loco_ed_ab        # 机车级 ED/AB 分工：每机车行为 [ed_mod, ab_mod]∈[-1,1]²

obs: env                       # 逐机车 11 维观测（含编队上下文 obs[10]=列间间距误差）
action: continuous
interaction: mappo_fleet       # MAPPO 交互（decompose：agent=每机车）
reward: env_default            # decompose 模式奖励口径 = _calculate_reward_decomposed（R2+gap 编队项+车钩力）

num_trains: 3
decision_interval: 10          # 半MDP 决策间隔（动作保持，剪短 15000 步信用链）
episodes: 120                  # 6 机车编队探索难，20ep 远不够（曾发散）；加大到 120
curriculum: 500:0,1000:10,2000:20,3000:30,5000:42,8000:55,12000:70,18000:82,24000:90,30000:98,36000:110   # 【2026-09-09 run2 调参】起始 500 步 + 更密渐变，最终锚点 36000@ep110 确保 53.2km 全程覆盖
init_speed_kmh: 80.0
simcase: official
ckpt_policy: fleet
log_interval: 10

dirs:
  checkpoint_dir: outputs/checkpoints_formation/seed0
  results_dir: outputs/checkpoints_formation/seed0/results
  figures_dir: outputs/checkpoints_formation/seed0/figures