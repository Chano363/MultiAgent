# ⛔ 【2026-11-13 ADR-068】本配置沿用旧口径 v_max=80 km/h（target=60 / d_eff=138.5）。
#    其结果**不得**与 v_max=75 口径的数字并列引用；如需复现请按 ADR-068 六量同批改口径。
# ADR-065 / S1 参数化探针：RL 不再做幅度调制，而是**直接设定循环制动相位门**
#   ed_mod → cyclic_brake_trigger_kmh（何时开始制动）
#   ab_mod → cyclic_release_kmh     （何时缓解）
# 底层 ED/AB 幅度全交给规则层（调制恒 0）。动作维度/网络结构不变 ⇒ 可复用 v10 权重做对照。
# 目的：判定"峰值上限是 residual 的幅度 tube（±0.5 限幅），还是规则层的相位排程"。
# 判据：确定性全程峰值是否 < residual 对照（v10 ep13 = 1280 kN）；若仍 ≥1260 且无下行
#       ⇒ 参数空间无效，直接进 S2（档位级直控）。
# ⚠️ 探针结果按 ADR-017 沙盒纪律，不得直接进论文主表。
name: probe_ruleparam_30ep
algorithm: mappo
algo_params:
  learning_rate: 0.00002
  gamma: 0.999
  gae_lambda: 0.99
  critic: per_agent
  clip_epsilon: 0.15
  entropy_coef: 0.005
  value_coef: 0.5
  epochs: 10
  batch_size: 128
  max_grad_norm: 0.5

env_type: fleet
env_cfg:
  num_trains: 3
  consist_preset: 10kt_1plus108
  grade_profile: shuozhou_ningwuxi_beidaniu_49km
  v_max: 22.22222222222222
  v_min: 11.111
  max_steps: 31500
  route_end_m: 49600
  max_accel: 1.0
  use_coupler_constraint: true
  coupler_force_limit_n: 1000000.0
  speed_band_shape: ref
  reward_term_log: true
  speed_ref_table: outputs/sim_validation/phys_validation/refspeed_baseline_20261111_090221/ref_speed_table.npz
  speed_over_w: 10.0
  hierarchical: false
  decompose: loco_ed_ab
  ab_min_refill_s: 222.0
  ab_min_hold_s: 0.0
  ed_native_force_conversion: true
  coupler_force_limit_emergency_n: 2250000.0
  cyclic_notch_50: true
  service_reduction_kpa: 74.12781799739679
  ab_staged_apply: true
  ab_staged_gap_s: 3.0
  cyclic_brake_trigger_kmh: 65.95262385531505
  cyclic_release_kmh: 54.956448104474134
  ed_release_coordination: true
  ed_release_hold_s: 16.970343976123257
  ed_release_boost_kn: 835.5980537119971
  cyclic_ab_upgrade_kmh: 71.08494805964575
  ed_upgrade_ramp_s: 16.65239691095876
  ed_upgrade_ramp_scale: 0.8225254007598803
  ed_grade_feedforward: true
  coupler_override: release
  eot: true
  start_randomization:
    enabled: true
    min_m: 4300
    max_m: 4300
  # 【S1 核心开关】RL 的 2 维动作重新解释为相位门（触发/缓解），幅度调制恒 0
  rule_param_probe: true

obs: env
action: continuous
interaction: mappo_fleet
reward: env_default

num_trains: 3
decision_interval: 10
episodes: 30
curriculum: "31500:0"
n_env: 4
n_env_parallel: true
parallel_traj_len: 0
warm_start: false
bc_episodes: 1
bc_epochs: 3000
bc_max_steps: 31500
long_eval_interval: 0
long_eval_steps: 31500
init_speed_kmh: 60.0
simcase: official
ckpt_policy: fleet
log_interval: 1

dirs:
  checkpoint_dir: outputs/checkpoints/formation_10kt_1plus108/_probe_ruleparam
  results_dir: outputs/results/formation_10kt_1plus108/_probe_ruleparam
  figures_dir: outputs/figures/formation_10kt_1plus108/_probe_ruleparam
