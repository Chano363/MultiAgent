algorithm:
  name: "PPO"

training:
  total_frames: 100000
  gamma: 0.99
  gae_lambda: 0.95
  num_envs: 4
  hyperparameters:
    ppo:
      learning_rate: 0.0003
      gamma: 0.99
      gae_lambda: 0.95
      clip_epsilon: 0.15
      entropy_coef: 0.001
      value_coef: 0.5
      epochs: 5
      batch_size: 64
      n_steps: 256
      max_grad_norm: 0.5
      use_gae: true
      use_clipped_value_loss: true
      use_entropy_decay: true

logging:
  log_interval: 10
  save_interval: 1000
  tensorboard: true
  log_dir: "outputs/logs"
  checkpoint_dir: "outputs/checkpoints"